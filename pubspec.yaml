name: lumen
description: "Lumen: озвучка текстовых книг нейроголосом"
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0

# Части приложения (зависимости только вниз): экраны (lib/) → lumen_player →
# lumen_voice → lumen_core; lumen_storage → lumen_core; lumen_import → lumen_core.
workspace:
  - packages/lumen_core
  - packages/lumen_voice
  - packages/lumen_storage
  - packages/lumen_import
  - packages/lumen_player

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_svg: ^2.2.0
  lumen_core: any
  lumen_voice: any
  lumen_storage: any
  lumen_import: any
  file_picker: ^13.4.1
  path_provider: ^2.1.6
  desktop_drop: ^0.8.4
  pdfrx: ">=3.1.0 <3.2.0"
  image: ^4.5.0
  lumen_player: any
  flutter_secure_storage: ^11.2.0
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.4
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  flutter_tts: ^4.2.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/music/
  fonts:
    - family: Onest
      fonts:
        - asset: assets/fonts/Onest-400.ttf
          weight: 400
        - asset: assets/fonts/Onest-500.ttf
          weight: 500
        - asset: assets/fonts/Onest-600.ttf
          weight: 600
        - asset: assets/fonts/Onest-700.ttf
          weight: 700
