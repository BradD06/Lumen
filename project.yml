# Описание Xcode-проекта для XcodeGen. Сам Lumen.xcodeproj не хранится в git:
#   brew install xcodegen && xcodegen generate
name: Lumen

options:
  bundleIdPrefix: io.github.bradd06
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

# Команда для подписи берётся из Config/Local.xcconfig, если он есть. Этот файл не хранится в git,
# поэтому после xcodegen команду не нужно выбирать заново. Без него проект собирается без команды.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  LumenKit:
    path: Packages/LumenKit

targets:
  Lumen:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - App
    # Свои типы данных для перетаскивания блоков и страниц нужно объявить, иначе система
    # может не передать их между частями окна. XcodeGen пишет этот файл при генерации проекта.
    info:
      path: App/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.lumen.block
            UTTypeDescription: Lumen Block
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
          - UTTypeIdentifier: app.lumen.page
            UTTypeDescription: Lumen Page
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification: {}
          # Форматы, которых нет в системе: без объявления iPhone не знает, что .fb2 и .cbz это книги.
          - UTTypeIdentifier: io.github.bradd06.lumen.fb2
            UTTypeDescription: FictionBook
            UTTypeConformsTo: [public.xml, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [fb2]
              public.mime-type: [application/x-fictionbook+xml]
          - UTTypeIdentifier: io.github.bradd06.lumen.cbz
            UTTypeDescription: Comic Book Archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [cbz]
              public.mime-type: [application/vnd.comicbook+zip]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown]
              public.mime-type: [text/markdown]
        # Какие файлы открываются в Lumen: книга из «Файлов», Telegram, почты и меню «Поделиться»
        # на iPhone, «Открыть с помощью» и перетаскивание на иконку в Dock на Mac.
        # Alternate: Lumen есть в списке, но не забирает файлы у Книг и Просмотра по умолчанию.
        # LSSupportsOpeningDocumentsInPlace не задан: на iPhone это значит, что присланный файл
        # система копирует в Lumen, и книга ложится в библиотеку. На Mac ключ со значением NO запрещён.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Книга
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
              - org.idpf.epub-folder
              - com.adobe.pdf
          - CFBundleTypeName: FictionBook и комиксы
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - io.github.bradd06.lumen.fb2
              - io.github.bradd06.lumen.cbz
          - CFBundleTypeName: Документ
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.openxmlformats.wordprocessingml.document
              - com.microsoft.word.doc
              - org.oasis-open.opendocument.text
              - public.rtf
              - org.openxmlformats.presentationml.presentation
          - CFBundleTypeName: Текст
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - net.daringfireball.markdown
              - public.html
        # Ссылки lumen:// на страницы, книги, цитаты и места в книгах.
        CFBundleURLTypes:
          - CFBundleURLName: io.github.bradd06.lumen
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [lumen]
        # Контейнер iCloud для синхронизации. Пусто = синхронизация выключена.
        # Задаётся в Config/Local.xcconfig, см. README, раздел про iCloud.
        LumenCloudKitContainer: $(LUMEN_CLOUDKIT_CONTAINER)
        # CloudKit будит приложение тихим push, когда на другом устройстве что-то поменяли.
        UIBackgroundModes: [remote-notification]
    dependencies:
      - package: LumenKit
        product: LumenStorage
      - package: LumenKit
        product: LumenUI
      - package: LumenKit
        product: LumenSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bradd06.lumen
        PRODUCT_NAME: Lumen
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lumen
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        # Права iCloud подключаются только в сборке с платным аккаунтом (Config/Local.xcconfig).
        # Без них приложение подписывается бесплатной командой и работает без синхронизации.
        CODE_SIGN_ENTITLEMENTS: $(LUMEN_ENTITLEMENTS)
    scheme:
      gatherCoverageData: false
      testTargets:
        - LumenAppUITests

  # UI-тесты на Mac: запускают приложение и работают с ним как пользователь (клики, перетаскивание).
  LumenAppUITests:
    type: bundle.ui-testing
    platform: auto
    supportedDestinations: [macOS]
    sources:
      - UITests
    dependencies:
      - target: Lumen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.bradd06.lumen.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Lumen
        SWIFT_VERSION: "5.0"
