<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lumen — логотипы</title><style>
body{margin:0;padding:32px 16px;font:15px/1.4 -apple-system,system-ui,sans-serif;background:#F4F4F6;color:#1F2433}
h1{text-align:center;font-weight:700}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:24px;max-width:1200px;margin:auto}
figure{margin:0;background:#fff;border-radius:20px;padding:16px;box-shadow:0 1px 3px #0001}img{width:100%;display:block}
figcaption{margin-top:10px;display:grid;gap:4px}figcaption span{color:#6B7080;font-size:13px}
</style></head><body><h1>Lumen — 15 вариантов логотипа</h1><main><figure><img src="logos/01-glowing-l.svg" alt="Светящаяся L"><figcaption><b>01. Светящаяся L</b><span>Буква L из луча света на тёмном фоне — прямое прочтение «люмен».</span></figcaption></figure><figure><img src="logos/02-book-ray.svg" alt="Книга с лучом"><figcaption><b>02. Книга с лучом</b><span>Раскрытая книга, из корешка которой выходит свет — про чтение и обучение.</span></figcaption></figure><figure><img src="logos/03-page-bulb.svg" alt="Страница-лампочка"><figcaption><b>03. Страница-лампочка</b><span>Лист с загнутым углом, внутри — лампочка-идея. Заметки + озарение.</span></figcaption></figure><figure><img src="logos/04-sunrise-pages.svg" alt="Рассвет над страницами"><figcaption><b>04. Рассвет над страницами</b><span>Солнце встаёт над стопкой листов — «каждый день чуть умнее».</span></figcaption></figure><figure><img src="logos/05-glowing-block.svg" alt="Светящийся блок"><figcaption><b>05. Светящийся блок</b><span>Стопка блоков как в редакторе, один горит — блочные страницы.</span></figcaption></figure><figure><img src="logos/06-quote-flame.svg" alt="Цитата-пламя"><figcaption><b>06. Цитата-пламя</b><span>Кавычка, превращающаяся в огонёк — выписки и цитаты из книг.</span></figcaption></figure><figure><img src="logos/07-candle.svg" alt="Свеча"><figcaption><b>07. Свеча</b><span>Минималистичный огонёк на кремовом фоне — тихое вечернее чтение.</span></figcaption></figure><figure><img src="logos/08-prism.svg" alt="Призма"><figcaption><b>08. Призма</b><span>Белый луч распадается на спектр — темы, виджеты, кастомизация.</span></figcaption></figure><figure><img src="logos/09-lighthouse.svg" alt="Маяк"><figcaption><b>09. Маяк</b><span>Маяк, освещающий путь — ориентир в задачах и знаниях.</span></figcaption></figure><figure><img src="logos/10-widget-star.svg" alt="Звезда в сетке виджетов"><figcaption><b>10. Звезда в сетке виджетов</b><span>Сетка 2×2, одна плитка — звезда. Намёк на магазин виджетов.</span></figcaption></figure><figure><img src="logos/11-moon-bookmark.svg" alt="Луна и закладка"><figcaption><b>11. Луна и закладка</b><span>Полумесяц, ставший закладкой — читать в любое время, место не потеряется.</span></figcaption></figure><figure><img src="logos/12-rings.svg" alt="Кольца света"><figcaption><b>12. Кольца света</b><span>Концентрические круги расходятся от точки — люмен как единица света.</span></figcaption></figure><figure><img src="logos/13-ribbon-spark.svg" alt="Лента-закладка с искрой"><figcaption><b>13. Лента-закладка с искрой</b><span>Закладка с искрой на кончике — «отмеченное важное».</span></figcaption></figure><figure><img src="logos/14-l-dot.svg" alt="Монограмма L·"><figcaption><b>14. Монограмма L·</b><span>Строгая монограмма L с точкой-искрой — для иконки и подписи.</span></figcaption></figure><figure><img src="logos/15-firefly.svg" alt="Светлячок"><figcaption><b>15. Светлячок</b><span>Светлячок со светящимся хвостом-траекторией — живой, дружелюбный маскот.</span></figcaption></figure></main></body></html>
