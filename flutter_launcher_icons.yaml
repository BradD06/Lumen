# Иконка из Lumen_exemple. Перегенерировать: dart run flutter_launcher_icons
# macOS берёт свои PNG (со скруглением и тенью) прямо в macos/Runner/Assets.xcassets.
flutter_launcher_icons:
  image_path: assets/icon/icon-square.png
  android: true
  # Android 8+: адаптивная иконка; рисунок — на фоне, система обрезает края.
  adaptive_icon_background: assets/icon/icon-android.png
  adaptive_icon_foreground: assets/icon/icon-android-foreground.png
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/icon/icon-rounded.png
    icon_size: 256
