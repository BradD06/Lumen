name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты пакетов
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Версии
        run: |
          xcodebuild -version
          swift --version
      - name: swift test
        # Падение отдаём системе (не Swift): тогда отчёт macOS о сбое пишет и причину падения.
        env:
          SWIFT_BACKTRACE: enable=no
        run: swift test --package-path Packages/LumenKit
      - name: Отчёт о падении тестов
        # Процесс тестов иногда падает сигналом 5: печатаем причину и стек упавшего потока из отчёта macOS.
        if: failure()
        run: |
          sleep 30
          ls -lt ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports 2>/dev/null | head -20
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name '*.ips' -mmin -30 2>/dev/null | while read -r report; do
            echo "=== $report"
            python3 - "$report" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          body = json.loads(text[text.index("\n") + 1:])
          print("exception:", body.get("exception"))
          print("asi:", json.dumps(body.get("asi"), ensure_ascii=False))
          images = body.get("usedImages", [])
          for index, thread in enumerate(body.get("threads", [])):
              if not thread.get("triggered"):
                  continue
              print("crashed thread", index, thread.get("queue"))
              for frame in thread.get("frames", [])[:40]:
                  image = images[frame["imageIndex"]].get("name", "?") if frame.get("imageIndex") is not None else "?"
                  print("  ", image, frame.get("symbol"), frame.get("sourceFile", ""), frame.get("sourceLine", ""))
          for frame in body.get("lastExceptionBacktrace", [])[:30]:
              image = images[frame["imageIndex"]].get("name", "?") if frame.get("imageIndex") is not None else "?"
              print("  exc:", image, frame.get("symbol"))
          PY
          done

  build:
    name: Сборка приложения (${{ matrix.platform }})
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: macOS
            destination: generic/platform=macOS
    steps:
      - uses: actions/checkout@v4
      - name: Установить XcodeGen
        run: brew install xcodegen
      - name: Сгенерировать проект
        run: xcodegen generate
      - name: Собрать
        run: |
          xcodebuild build \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*Sendable|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

  ui-test:
    name: UI-тесты (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Установить XcodeGen
        run: brew install xcodegen
      - name: Сгенерировать проект
        run: xcodegen generate
      - name: Запустить UI-тесты
        run: |
          set -o pipefail
          xcodebuild test \
            -project Lumen.xcodeproj \
            -scheme Lumen \
            -destination 'platform=macOS' \
            -only-testing:LumenAppUITests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            | tee ui-test.log | grep -E "error:|Test Case|Executed|TEST (SUCCEEDED|FAILED)|XCTAssert"
