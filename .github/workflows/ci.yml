name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.1

jobs:
  test:
    name: Проверка кода и тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Формат кода
        run: dart format --line-length 100 --output=none --set-exit-if-changed lib test packages
      - run: flutter analyze
      - name: Тесты приложения
        run: flutter test
      - name: Тесты частей (packages/)
        run: |
          for p in packages/*/; do
            echo "::group::$p"
            (cd "$p" && dart test) || exit 1
            echo "::endgroup::"
          done

  android:
    name: Сборка Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-android
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  windows:
    name: Сборка Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: lumen-windows
          path: build/windows/x64/runner/Release/
          retention-days: 7

  apple:
    name: Сборка macOS и iOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: macOS
        run: flutter build macos --release
      - name: iOS (без подписи)
        run: flutter build ios --release --no-codesign
